# voice-lora 配置示例。复制到 local/config.yaml 再改；local/ 不进版本控制。
# 所有相对路径都相对于本文件所在目录解析。

author:
  name: 作者                     # 出现在训练指令里的称呼，训练和推理必须一致
  instruction: 把下面这段文字改写成{name}的文风，内容和顺序不变。

workdir: local/runs/v1           # 数据、改写、训练输出、评估结果都写在这里

corpus:
  paths:                         # 作者本人写的文章，支持 glob
    - /path/to/your/blog/content/*.md
  frontmatter: auto              # auto：识别 "---" 包裹或 Pelican 式 "Key: value" 头
  min_cjk_ratio: 0.15            # 汉字占比低于此值视为英文文章，排除
  exclude:
    filename_suffixes: ["-en.md", "_en.md"]
    tags: ["English"]
    statuses: ["draft"]
    slugs: []                    # 单独排除的文章（例如文中声明"本文由 AI 撰写"的演示文章）
    date_ranges:                 # 非本人手写的时间段（含首尾），整段排除
      - ["2020-01-01", "2020-06-30"]
  units:
    min_chars: 50                # 更短的段落并入下一段
    max_chars: 800               # 更长的段落在句末标点处对半切
  split:
    test_posts: 20
    val_posts: 10
    seed: 42
    min_test_per_bucket: {}      # 按年份桶的最少测试文章数，例如 {"2026": 2}
    from_file: null              # 沿用上一轮的划分（上一轮 workdir 里的 posts.csv），保证多轮结果可比；新文章进训练集

rewriter:                        # 任何 OpenAI 兼容接口，用来把原文改写成 AI 腔
  base_url: http://localhost:8000/v1
  model: your-rewriter-model
  api_key_env: REWRITER_API_KEY  # 本地服务不需要 key 时，环境变量可以不设
  concurrency: 6
  sampling: {temperature: 1.0, top_p: 0.95}
  extra_body: {}                 # 例如关闭思考：{"chat_template_kwargs": {"enable_thinking": false}}
# rewriters:                     # 可选：paragraph_rewrite 用多个改写模型时改用列表，替代上面的 rewriter
#   - name: local                  # 第一个模型的改写用原始 prompt id（style_mimic），其余加后缀（style_mimic@second）
#     base_url: http://localhost:8000/v1
#     model: your-rewriter-model
#   - name: second
#     base_url: https://api.example.com/v1
#     model: another-family-model
#     prompts: [default, formal, style_mimic]   # 每个模型可以只用部分 prompt

drafters:                        # 只有 outline_regen 用：按要点写整节的模型，可以列多个，每节每个模型各写若干候选
  - name: main                   # 第一个模型的候选用原始 prompt id（draft_style），其余加后缀（draft_style@second）
    base_url: http://localhost:8000/v1
    model: your-drafter-model
    api_key_env: DRAFTER_API_KEY
    concurrency: 16
    extra_body: {}               # 例如 {reasoning_effort: low} 或 {thinking: {type: disabled}}
    prompts: [draft_default, draft_style, draft_formal]
  # - name: second               # 第二个模型，写法同上
  #   ...
  # 命令行 agent 也可以当 drafter：
  # - name: cli
  #   kind: command
  #   command: ["your-agent-cli", "--print", "Read {prompt_file} and follow it exactly."]
  #   output_file: output.txt
  #   prompt_suffix: "把结果写入 {output_file}，只写正文。"
  #   timeout_s: 600
  #   concurrency: 10
  #   run_dir: /path/to/scratch    # 每次调用一个空目录作为工作目录

builder:
  name: paragraph_rewrite        # 唯一推荐的构造器。outline_regen（v2，节级）不采用，只为复现保留，需另设 allow_experimental: true，见 docs/v2_experiment.md
  sections: {target_chars: 900, max_paras: 6, min_tail: 300}   # 仅 outline_regen
  prompts: [default, formal, style_mimic, expand, condense]
  style_exemplars:               # style_mimic 用的"目标 AI 文风"示例文章，最好就是你之后要改写的那类文章
    paths:
      - /path/to/ai-written-articles/*.md
    exclude: []                  # 留作端到端评估的文章写在这里，避免泄漏
  filter:
    length_ratio: [0.5, 1.9]
    max_invented_latin: 1
  identity_fraction: 0.05        # 原文→原文的恒等对比例，教模型不乱改已经像人话的句子

train:
  base_model: Qwen/Qwen3.5-9B-Base
  rank: 32
  alpha: 32
  lr: 1.0e-4
  epochs: 0.5                    # 每个目标段落有多条改写，0.5 epoch 通常已到验证 loss 最低点
  batch: 4
  grad_accum: 4
  max_seq: 2048
  save_every: 0.25
  val_max_samples: 300           # 验证集只抽这么多条算 loss：它只用来找最低点，全量评估每次要多花半分钟

evaluate:
  articles:                      # 端到端评估：真正想改写的 AI 文章，逐段送进模型
    - /path/to/ai-written-articles/held-out-article.md
  fewshot_k: 8                   # 基线：rewriter + 检索 k 段原文作例子

serve:
  base_url: http://localhost:8000/v1   # scripts/serve_vllm.sh 起的服务
  model: voice-lora
